name: Weekly India Agri Startup Digest

on:
  schedule:
    # Runs every Monday at 09:00 IST (03:30 UTC). Cron is UTC — adjust as needed.
    - cron: "30 3 * * 1"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

jobs:
  build-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest and create Gmail draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: python weekly_digest.py
